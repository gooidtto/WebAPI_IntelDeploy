name: package-source

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source package
        run: |
          rm -rf .git .github scripts/__pycache__
          zip -r WebAPI_IntelDeploy-modified.zip . -x '*.pyc' '*.DS_Store'
      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: WebAPI_IntelDeploy-modified
          path: WebAPI_IntelDeploy-modified.zip
          if-no-files-found: error
